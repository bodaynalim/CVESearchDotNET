name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: build solution (warnings as errors)
        run: dotnet build Cve.Net.Search.sln --nologo
      - name: backend tests
        run: dotnet test Tests/Cve.Net.Search.Tests --nologo
      - name: editorconfig compliance (T13)
        run: dotnet format --verify-no-changes --severity warn

  cveui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CveUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular CLI requires Node >= 22 (see CveUI package.json engines);
          # v20 caused CI-only "frontend tests" failures while local (v24) passed.
          node-version: '22'
          cache: npm
          cache-dependency-path: CveUI/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.spec.json
      - name: frontend tests
        run: npm test
      - name: production build
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: doc links resolve
        run: node scripts/check-docs.js
